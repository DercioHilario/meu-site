<!DOCTYPE html>

<head>

<style>
  .rodape-links a { margin: 0 2px; }
  /* Fonte servida pelo próprio site: nenhum pedido a terceiros ao abrir a página */
  @font-face { font-family: 'Wellfleet'; src: url('fontes/Wellfleet-Regular.ttf') format('truetype'); font-display: swap; }
  :root {
    --fundo: #000000;
    --superficie: #0E1520;
    --superficie2: #172131;

    --texto: #FFFFFF;
    --texto2: #A9B5C7;

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {

  .largura { width: 100%; max-width: 760px; margin: 0 auto; }
  .marca-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marca { color: var(--texto); font-size: 26px; letter-spacing: 6px; }
  select {
    background: var(--superficie);
    color: var(--texto);
    border: 1px solid var(--borda);
    border-radius: 12px;
    font: inherit;
    font-size: 14px;
    min-height: 44px;
    padding: 0 10px;
  }
  .abas-fundo {
    position: sticky;
    top: 0;
    z-index: 2;
    background: rgba(0, 0, 0, .94);
    border-bottom: 1px solid var(--borda);
    margin-top: 16px;
  }
  nav {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 16px;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: none;
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 22px;
    border: 1px solid var(--borda);
    background: var(--superficie);
    color: var(--texto2);
    font-size: 14.5px;
    text-decoration: none;
  }
  nav a[aria-current="page"] { background: var(--azul); border-color: var(--azul); color: #FFFFFF; }
  main { padding: 26px 16px 40px; }
  h1 { color: var(--texto); font-size: 32px; font-weight: 400; line-height: 1.2; margin-bottom: 8px; }
  h2 { color: var(--texto); font-size: 20px; font-weight: 400; line-height: 1.3; margin: 30px 0 8px; }
  p { margin-bottom: 12px; }
  ul, ol { margin: 0 0 14px 22px; }
  li { margin-bottom: 7px; }
  strong { color: var(--texto); font-weight: 400; }
  a { color: var(--azul-claro); }
  .versao { color: var(--texto3); font-size: 14px; margin-bottom: 20px; }
  .aviso {
    background: rgba(242, 169, 59, .1);
    border: 1px solid rgba(242, 169, 59, .5);
    border-radius: 14px;
    color: var(--texto);
    font-size: 14.5px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .cartao {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 18px;
    padding: 16px;
    margin: 12px 0;
  }
  .cartao h2 { margin-top: 0; }
  .cartao p:last-child { margin-bottom: 0; }
  .botao {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    border-radius: 26px;
    background: var(--azul);
    color: #FFFFFF;
    font-size: 16px;
    padding: 0 18px;
    text-align: center;
    text-decoration: none;
    margin-top: 12px;
  }
  .tabela { overflow-x: auto; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14.5px; }
  th, td { border: 1px solid var(--borda); padding: 9px 10px; text-align: left; vertical-align: top; }
  th { background: var(--superficie2); color: var(--texto); font-weight: 400; }
  footer {
    border-top: 1px solid var(--borda);
    color: var(--texto3);
    font-size: 13.5px;
    padding: 20px 16px 36px;
  }
  .campo {
    display: block; width: 100%; box-sizing: border-box; min-height: 52px; margin-top: 10px;
    border-radius: 16px; border: 1px solid var(--borda); background: var(--superficie2);
    color: var(--texto); font: inherit; font-size: 16px; padding: 0 16px;
  }
  .rec-msg { min-height: 20px; margin: 10px 0 0; color: var(--texto2); font-size: 14.5px; }
  :focus-visible { outline: 2px solid var(--azul-claro); outline-offset: 2px; }
</style>
</head>

             '<h2>Esqueci-me da palavra-passe</h2><p>No ecrã de iniciar sessão, toca em <strong>Esqueci-me da palavra-passe</strong>. Enviamos um link para o teu e-mail.</p>' +

             '<h2>5. O teu conteúdo</h2><ul><li>O que publicas continua a ser teu.</li><li>Para o serviço funcionar, dás ao Scype uma licença não exclusiva, gratuita e limitada ao funcionamento da plataforma para guardar, mostrar a quem tem acesso, traduzir automaticamente e gerar as imagens de partilha que pedires. Termina quando apagas o conteúdo ou a conta, salvo cópias que a lei obrigue a guardar.</li><li>Só publicas o que tens direito a publicar. Se aparecerem outras pessoas, precisas da autorização delas.</li><li>As provas são vistas pelos participantes do desafio. Na Comunidade só aparecem se ativares "Partilhar na Comunidade" e forem aprovadas. <strong>Nunca és obrigado a mostrar a tua cara, o teu corpo ou a tua casa.</strong></li></ul>' +

        },

             '<h2>3. O que os outros veem</h2><p>Quem tem conta pode ver o teu nome de utilizador, foto, nível, recorde de sequência, número de selos, apoiantes (conforme as tuas definições) e as provas que escolheste partilhar. <strong>O e-mail nunca é mostrado.</strong></p>' +
             '<h2>4. Fornecedores (quem trata dados por nossa conta)</h2><div class="tabela"><table><thead><tr><th>Empresa</th><th>Para quê</th><th>Que dados</th></tr></thead><tbody>' +

             '<tr><td>Google (Firebase Cloud Messaging)</td><td>Entregar as notificações</td><td>Token do telemóvel e o texto da notificação</td></tr>' +
             '<tr><td>Google (Entrar com o Google) e Apple (Entrar com a Apple), só se os usares</td><td>Entrar sem palavra-passe</td><td>Nome, e-mail e foto da conta</td></tr>' +

             '<tr><td>Google Play</td><td>Distribuição da app e o pedido de avaliação da loja</td><td>Conforme a política da Google</td></tr>' +
             '<tr><td>[Fornecedor de e-mail, por definir]</td><td>Enviar os e-mails da conta (código, recuperação)</td><td>E-mail</td></tr>' +
             '</tbody></table></div><p>A <strong>tradução automática</strong> é feita no teu telemóvel (Google ML Kit): o texto não sai do aparelho. Não há publicidade nem rastreadores de terceiros na app.</p>' +
             '<h2>5. Quanto tempo guardamos</h2><ul><li>Conta, desafios, provas, mensagens e o registo dos aceites: enquanto a conta existir. Ao apagares a conta, são apagados de imediato.</li><li>Cópias de segurança: substituídas periodicamente pelo fornecedor.</li><li>Registos de falhas, estatísticas de uso e contagem de ecrãs: 90 dias.</li><li>Notificações por entregar: 60 dias. Registos de envio de notificações: 90 dias. Tentativas de código: 30 dias.</li><li>Denúncias e decisões de moderação: 24 meses, para defesa de direitos.</li><li>Pedidos de ajuda e sugestões: 24 meses.</li></ul><p>O que passa do prazo é apagado automaticamente todos os dias.</p>' +
             '<h2>6. Os teus direitos</h2><p>Podes pedir acesso, correção, apagamento, limitação e portabilidade, e opor-te a tratamentos baseados em interesse legítimo, <strong>sem custo</strong>. Na app: <strong>Perfil → Privacidade → Os meus dados → Baixar</strong> dá-te uma cópia de tudo num ficheiro; <strong>Perfil → Conta e segurança → Apagar conta</strong> apaga tudo, menos o que a lei obrigar a guardar. Para o resto, escreve para <a href="mailto:{emailPrivacidade}">{emailPrivacidade}</a>. Podes também reclamar à autoridade de proteção de dados (no Brasil, a ANPD; em Portugal, a CNPD).</p>' +

             '<h2>10. Inteligência artificial e decisões automáticas</h2><p><strong>Não usamos os teus dados para treinar inteligência artificial.</strong> As mensagens do Alter Ego são escolhidas no teu telemóvel a partir de textos escritos pela equipa do Scype, e a tradução é feita no próprio telemóvel. A moderação automática oculta conteúdo com muitas denúncias até ser revisto; podes sempre contestar (ver <a href="#moderacao">Moderação</a>). Se um dia isto mudar, avisamos antes e podes recusar.</p>' +

        },

      btn.disabled = true;
      btn.textContent = r.aGuardar;
      fetch(SUPABASE_URL + '/auth/v1/user', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON, Authorization: 'Bearer ' + recuperacao.token },
        body: JSON.stringify({ password: nova })
      }).then(function (res) {
        if (!res.ok) throw new Error(String(res.status));
        // A sessão do link não fica na página
        history.replaceState(null, '', location.pathname + location.search);
        c.innerHTML = '<h1>' + esc(r.h) + '</h1><div class="cartao"><p>' + esc(r.ok) + '</p></div>';
      }).catch(function () {
        msg.style.color = '#FF6B6B';
        msg.textContent = r.erro;
        btn.disabled = false;
        btn.textContent = r.guardar;
      });
    });
  }

  // Rodapé: os documentos legais à distância de um toque, em todas as vistas
  function desenharRodape(t) {
    var r = document.getElementById('rodape');
    var links = ['termos', 'privacidade', 'regras', 'moderacao', 'eliminar-conta']
      .map(function (id) { return '<a href="#' + id + '">' + t.abas[id] + '</a>'; })
      .join(' · ');
    r.innerHTML = '<p>' + preencher(t.rodape) + '</p><p class="rodape-links">' + links + '</p>' +
      '<p>' + preencher(t.contactoPrivacidade) + '</p>';
  }

  function desenhar() {
    if (recuperacao) return desenharRecuperacao();
    var t = TEXTOS[lingua];
    var atual = seccaoAtual();
    var doc = t.docs[atual];
    document.documentElement.lang = lingua;
    document.title = doc.h + ' - Scype';
    document.getElementById('idioma').value = lingua;
    document.getElementById('abas').innerHTML = ORDEM.map(function (id) {
      return '<a href="#' + id + '"' + (id === atual ? ' aria-current="page"' : '') + '>' + t.abas[id] + '</a>';
    }).join('');
    var aviso = AVISO_INGLES[pedida] ? '<p class="aviso" lang="' + pedida + '">' + AVISO_INGLES[pedida] + '</p>' : '';
    var versao = atual === 'ajuda' ? '' : '<p class="versao">' + preencher(t.versao) + '</p>';
    document.getElementById('conteudo').innerHTML = aviso + '<h1>' + doc.h + '</h1>' + versao + preencher(doc.c);
    desenharRodape(t);
    var ativa = document.querySelector('nav a[aria-current="page"]');
    if (ativa && ativa.scrollIntoView) ativa.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  document.getElementById('idioma').addEventListener('change', function (e) {
    lingua = e.target.value;
    pedida = lingua;
    var url = new URL(location.href);
    url.searchParams.set('lang', lingua);
    history.replaceState(null, '', url);
    desenhar();
  });
  window.addEventListener('hashchange', function () {
    desenhar();
    window.scrollTo(0, 0);
  });
  desenhar();
})();
</script>
</body>
</html>
